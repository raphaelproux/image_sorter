[package]
name = "image_sorter"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "bmp", "tiff", "webp"] }
png = "0.18"
flate2 = "1"
jpeg-decoder = { version = "0.3", default-features = false }
md5 = "0.7"
url = "2"
kamadak-exif = "0.6"
native-dialog = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "6"


[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
